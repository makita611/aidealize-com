<style>
:root{
  --red:#0891b2;--red-dark:#0e7490;
  --ink:#1e293b;--body:#4b5563;--light:#94a3b8;
  --border:#e2e8f0;--bg:#f8fafc;--bg2:#f1f5f9;--white:#fff;
  --tag-bg:#ecfeff;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{font-family:'Noto Sans JP',sans-serif;background:var(--white);color:var(--ink);overflow-x:hidden;line-height:1.7;}
#mainNav{position:fixed;top:0;left:0;right:0;z-index:1000;display:flex;align-items:center;justify-content:space-between;padding:0 60px;height:68px;background:rgba(255,255,255,0.97);border-bottom:1px solid var(--border);backdrop-filter:blur(12px);}
.nav-logo{display:flex;align-items:center;gap:10px;text-decoration:none;}
.nav-logo img{height:34px;width:auto;}
.nav-logo-text{font-family:'DM Mono',monospace;font-size:15px;font-weight:500;color:var(--ink);letter-spacing:0.02em;}
.nav-logo-text span{color:var(--red);}
@media(max-width:1024px){#mainNav{padding:0 28px;}}
@media(max-width:480px){#mainNav{padding:0 16px;height:60px;}.nav-logo-text{font-size:13px;}}
.wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:140px 24px 80px;background:var(--bg);}
.card{max-width:560px;text-align:center;}
.code{font-family:'DM Mono',monospace;font-size:13px;color:var(--red);letter-spacing:0.14em;text-transform:uppercase;margin-bottom:18px;}
h1{font-family:'Shippori Mincho',serif;font-size:clamp(22px,4vw,32px);font-weight:700;color:var(--ink);line-height:1.6;margin-bottom:16px;}
p{font-size:15px;line-height:1.9;color:var(--body);margin-bottom:32px;}
.links{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:28px;}
.btn-red{display:inline-flex;align-items:center;gap:6px;background:var(--red);color:#fff;padding:13px 28px;border-radius:4px;font-size:14px;font-weight:700;text-decoration:none;transition:background 0.2s;}
.btn-red:hover{background:var(--red-dark);}
.btn-ghost{display:inline-flex;align-items:center;gap:6px;background:#fff;color:var(--red);border:1.5px solid var(--red);padding:13px 28px;border-radius:4px;font-size:14px;font-weight:700;text-decoration:none;transition:background 0.2s;}
.btn-ghost:hover{background:var(--tag-bg);}
.sub-links{font-size:13px;color:var(--light);}
.sub-links a{color:var(--body);text-decoration:none;margin:0 8px;}
.sub-links a:hover{color:var(--red);}
</style>
</head>

<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-P6VNBWH3" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>

    <span class="nav-logo-text"><span>AI</span>dealize</span>
  </a>
</nav>

<div class="wrap">
  <div class="card">
    <div class="code">404 Not Found</div>
    <h1>お探しのページが見つかりませんでした。</h1>
    <p>URLが変更・削除された、または入力に誤りがある可能性があります。<br>下記から目的のページをお探しください。</p>
    <div class="links">
      <a href="/" class="btn-red">トップページへ →</a>
      <a href="/column/" class="btn-ghost">コラム一覧を見る</a>
    </div>
    <div class="sub-links">
      <a href="/service/">サービス</a>｜
      <a href="https://aidealize.com/bpr/">DX事例</a>｜
      <a href="/company.html">会社概要</a>
    </div>
  </div>
</div>

</body>
</html>
