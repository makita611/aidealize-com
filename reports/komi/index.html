<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>週次サイトレポート｜artmake-komi.com</title>
<style>
  :root { --cyan: #0891b2; --cyan-dark: #0e7490; --ink: #1e293b; --light: #94a3b8; --border: #e2e8f0; --bg2: #f1f5f9; --tag-bg: #ecfeff; }
  * { box-sizing: border-box; }
  body { font-family: "Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif; background: var(--bg2); margin: 0; padding: 20px; color: var(--ink); }
  .sheet { max-width: 640px; margin: 0 auto; }
  .top { background: linear-gradient(135deg, var(--ink) 0%, #16233a 100%); color: #fff; border-radius: 14px; padding: 22px 26px; margin-bottom: 16px; border-bottom: 3px solid var(--cyan); }
  .top h1 { margin: 0 0 4px; font-size: 18px; }
  .top .sub { font-size: 12px; opacity: 0.7; }
  .report-row { display: flex; justify-content: space-between; align-items: center; background: #fff; padding: 14px 18px; border: 1px solid var(--border); border-radius: 10px; margin-bottom: 10px; text-decoration: none; color: var(--ink); }
  .report-row:hover { background: var(--tag-bg); }
  .report-row .date { font-size: 14px; font-weight: 700; }
  .report-row .badge { font-size: 11px; font-weight: 700; color: var(--cyan-dark); background: var(--tag-bg); padding: 3px 10px; border-radius: 100px; }
</style>
</head>
<body>
<div class="sheet">
  <div class="top">
    <h1>artmake-komi.com 週次レポート一覧</h1>
    <div class="sub">AI集客エージェント｜週次自動監査エンジン PoC</div>
  </div>
  <a class="report-row" href="20260701.html">
    <span class="date">2026/07/01 作成分</span>
    <span class="badge">最新</span>
  </a>
</div>
</body>
</html>
