<!DOCTYPE html>
<html>
<head><meta charset="UTF-8">
<style>*{margin:0;padding:0}body{overflow:hidden}iframe{display:block;border:none}</style>
</head>
<body>
<iframe id="roi" src="ROI診断.html" width="100%" height="900" scrolling="no"></iframe>
<script>
window.addEventListener('message', function(e) {
  if (e.data && e.data.type === 'roiHeight') {
    var h = e.data.height;
    document.getElementById('roi').style.height = h + 'px';
    window.parent.postMessage({type:'roiHeight', height: h}, '*');
  }
});
</script>
</body></html>
