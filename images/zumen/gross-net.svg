<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 310" role="img" aria-label="グロスとネットの違いの図解"><rect width="600" height="310" fill="#fff"/><text x="300" y="28" font-size="18" fill="#1e293b" text-anchor="middle" font-weight="700" font-family="Noto Sans JP,Hiragino Sans,Yu Gothic,Meiryo,sans-serif">グロスとネットの違い（PL22×808×524の例）</text><rect x="40" y="60" width="240" height="155" fill="#fff" stroke="#1d3557" stroke-width="3" stroke-dasharray="8 5"/><path d="M40 215 L40 60 L280 60 L280 215Z" fill="#f1f5f9" opacity=".6"/><text x="160" y="250" font-size="15" fill="#1e293b" text-anchor="middle" font-weight="700" font-family="Noto Sans JP,Hiragino Sans,Yu Gothic,Meiryo,sans-serif">グロス：外形の長方形</text><text x="160" y="272" font-size="18" fill="#b45309" text-anchor="middle" font-weight="700" font-family="Noto Sans JP,Hiragino Sans,Yu Gothic,Meiryo,sans-serif">73.12 kg</text><polygon points="358,215 562,215 580,197 580,60 340,60 340,197" fill="#f1f5f9" stroke="#1d3557" stroke-width="3"/><circle cx="385" cy="138" r="13" fill="#fff" stroke="#1d3557" stroke-width="3"/><circle cx="535" cy="138" r="13" fill="#fff" stroke="#1d3557" stroke-width="3"/><path d="M340 197 L358 215" stroke="#dc2626" stroke-width="2"/><text x="460" y="250" font-size="15" fill="#1e293b" text-anchor="middle" font-weight="700" font-family="Noto Sans JP,Hiragino Sans,Yu Gothic,Meiryo,sans-serif">ネット：隅切りと穴を引く</text><text x="460" y="272" font-size="18" fill="#0891b2" text-anchor="middle" font-weight="700" font-family="Noto Sans JP,Hiragino Sans,Yu Gothic,Meiryo,sans-serif">71.97 kg</text><text x="300" y="298" font-size="13" fill="#475569" text-anchor="middle" font-weight="400" font-family="Noto Sans JP,Hiragino Sans,Yu Gothic,Meiryo,sans-serif">差は約1.15kg（約1.6%）。塗装面積はネットで数える</text></svg>